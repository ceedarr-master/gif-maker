<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIF Maker — 동영상을 GIF로</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>GIF Maker</h1>
      <p class="subtitle">동영상을 고화질 GIF로 변환 &mdash; 트위터 업로드 최적화</p>
      <div class="wizard-steps" id="wizard-steps" hidden>
        <div class="wizard-step" data-step="1" title="업로드"></div>
        <div class="wizard-step" data-step="2" title="트림"></div>
        <div class="wizard-step" data-step="3" title="색보정"></div>
        <div class="wizard-step" data-step="4" title="변환"></div>
      </div>
    </header>

    <!-- Step 1: Upload -->
    <section id="step-upload">
      <div id="drop-zone" role="button" tabindex="0" aria-label="동영상 파일을 업로드하려면 클릭하거나 드래그하세요">
        <div class="drop-icon">🎬</div>
        <p class="drop-label">동영상을 여기에 드래그하거나<br><span class="link">클릭하여 선택</span></p>
        <p class="drop-hint">MP4, MOV, AVI, WebM 등 지원 · 최대 500MB</p>
        <input type="file" id="file-input" accept="video/*" hidden />
      </div>
    </section>

    <!-- Step 2: Trim -->
    <section id="step-trim" hidden>
      <div id="needs-trim-banner" class="needs-trim-banner" hidden></div>

      <video id="video-preview" controls muted playsinline></video>

      <div id="scrubber-wrap">
        <div id="scrubber-strip">
          <canvas id="scrubber-canvas"></canvas>
          <div id="scrubber-range">
            <div id="handle-start" class="scrubber-handle" role="slider" aria-label="시작 시간"></div>
            <div id="handle-end" class="scrubber-handle" role="slider" aria-label="종료 시간"></div>
          </div>
        </div>
        <div id="scrubber-labels">
          <span id="label-start">0.0초</span>
          <span id="label-duration">전체</span>
          <span id="label-end">0.0초</span>
        </div>
      </div>

      <div class="option-group">
        <label>FPS 선택</label>
        <div class="fps-group" role="group" aria-label="FPS 선택">
          <button class="fps-btn" data-fps="30">30</button>
          <button class="fps-btn" data-fps="24">24</button>
          <button class="fps-btn" data-fps="20">20</button>
          <button class="fps-btn active" data-fps="15">15</button>
          <button class="fps-btn" data-fps="12">12</button>
          <button class="fps-btn" data-fps="10">10</button>
          <button class="fps-btn" data-fps="8">8</button>
          <button class="fps-btn" data-fps="6">6</button>
        </div>
      </div>

      <div class="step-actions">
        <button id="to-corrections-btn" class="btn btn-secondary">색보정 설정 →</button>
        <button id="skip-corrections-btn" class="btn btn-primary">바로 변환 시작</button>
      </div>
    </section>

    <!-- Step 3: Corrections -->
    <section id="step-corrections" hidden>
      <h2>색보정</h2>
      <div class="corrections-grid">
        <div class="option-group">
          <label for="brightness">밝기 <span id="brightness-val" class="badge">0</span></label>
          <input type="range" id="brightness" min="-1" max="1" step="0.05" value="0" />
          <div class="range-hints"><span>어둡게</span><span>밝게</span></div>
        </div>
        <div class="option-group">
          <label for="contrast">대비 <span id="contrast-val" class="badge">1.0</span></label>
          <input type="range" id="contrast" min="0.5" max="2" step="0.05" value="1" />
          <div class="range-hints"><span>낮음</span><span>높음</span></div>
        </div>
        <div class="option-group">
          <label for="saturation">채도 <span id="saturation-val" class="badge">1.0</span></label>
          <input type="range" id="saturation" min="0" max="3" step="0.05" value="1" />
          <div class="range-hints"><span>흑백</span><span>선명</span></div>
        </div>
        <div class="option-group">
          <label for="sharpness">선명도 <span id="sharpness-val" class="badge">0.0</span></label>
          <input type="range" id="sharpness" min="0" max="2" step="0.1" value="0" />
          <div class="range-hints"><span>없음</span><span>강하게</span></div>
        </div>
      </div>

      <div class="step-actions">
        <button id="back-to-trim-btn" class="btn btn-secondary">← 다시 자르기</button>
        <button id="start-convert-btn" class="btn btn-primary">GIF 변환 시작</button>
      </div>
    </section>

    <!-- Step 4: Converting -->
    <section id="step-converting" hidden>
      <h2>변환 중...</h2>
      <div class="progress-bar-wrap">
        <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
      </div>
      <p id="progress-message" class="progress-message">준비 중...</p>
      <div id="resize-notice" class="resize-notice" hidden></div>
      <button id="cancel-btn" class="btn btn-secondary" style="margin-top:16px">취소</button>
    </section>

    <!-- Interrupt: Needs Resolution -->
    <section id="step-needs-res" hidden>
      <div id="needs-res-banner" class="needs-trim-banner"></div>
      <p class="option-group" style="margin-top:16px">해상도를 선택하세요:</p>
      <div class="resolution-group">
        <button class="resolution-btn" data-scale="0.9">90%</button>
        <button class="resolution-btn" data-scale="0.8">80%</button>
        <button class="resolution-btn" data-scale="0.7">70%</button>
        <button class="resolution-btn" data-scale="0.6">60%</button>
        <button class="resolution-btn" data-scale="0.5">50%</button>
      </div>
      <div class="step-actions" style="margin-top:20px">
        <button id="back-to-trim-from-res-btn" class="btn btn-secondary">← 다시 자르기</button>
        <button id="confirm-res-btn" class="btn btn-primary" disabled>이 해상도로 변환</button>
      </div>
    </section>

    <!-- Result -->
    <section id="step-result" hidden>
      <h2>변환 완료!</h2>
      <div id="result-meta" class="result-meta"></div>
      <div class="gif-preview-wrap">
        <img id="gif-preview" src="" alt="변환된 GIF 미리보기" />
      </div>
      <div class="result-actions">
        <a id="download-btn" href="#" class="btn btn-primary" download>GIF 다운로드</a>
        <button id="reset-btn" class="btn btn-secondary">다른 영상 변환</button>
      </div>
    </section>

    <!-- Error -->
    <section id="step-error" hidden>
      <div class="error-box">
        <div class="error-icon">❌</div>
        <p id="error-message"></p>
        <button id="error-reset-btn" class="btn btn-secondary">다시 시도</button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
