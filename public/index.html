<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIF Maker — 동영상을 GIF로</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🎞 GIF Maker</h1>
      <p class="subtitle">동영상을 고화질 GIF로 변환 &mdash; 트위터 업로드 (15MB 이하) 최적화</p>
    </header>

    <!-- Upload Section -->
    <section id="upload-section">
      <div id="drop-zone" role="button" tabindex="0" aria-label="동영상 파일을 업로드하려면 클릭하거나 드래그하세요">
        <div class="drop-icon">🎬</div>
        <p class="drop-label">동영상을 여기에 드래그하거나 <span class="link">클릭하여 선택</span></p>
        <p class="drop-hint">MP4, MOV, AVI, WebM 등 지원 · 최대 500MB</p>
        <input type="file" id="file-input" accept="video/*" hidden />
      </div>

      <div id="video-preview-wrap" hidden>
        <video id="video-preview" controls muted playsinline></video>
        <p id="video-info" class="video-info"></p>
      </div>

      <!-- Options -->
      <div id="options-panel" hidden>
        <h2>변환 옵션</h2>
        <div class="options-grid">
          <div class="option-group">
            <label for="start-time">시작 시간 (초)</label>
            <input type="number" id="start-time" min="0" step="0.1" value="0" />
          </div>
          <div class="option-group">
            <label for="end-time">종료 시간 (초)</label>
            <input type="number" id="end-time" min="0" step="0.1" value="" />
          </div>
          <div class="option-group">
            <label for="fps">
              FPS <span id="fps-value" class="badge">15</span>
            </label>
            <input type="range" id="fps" min="6" max="30" step="1" value="15" />
            <div class="range-hints"><span>6</span><span>30</span></div>
          </div>
          <div class="option-group">
            <label for="width">해상도 (가로)</label>
            <select id="width">
              <option value="320">320px (소형)</option>
              <option value="480" selected>480px (권장)</option>
              <option value="640">640px (중형)</option>
              <option value="800">800px (대형)</option>
              <option value="-1">원본 크기</option>
            </select>
          </div>
        </div>

        <div class="size-warning">
          <span>⚠️</span>
          파일이 15MB를 초과하면 자동으로 화질을 조정합니다.
        </div>

        <button id="convert-btn" class="btn btn-primary">GIF 변환 시작</button>
      </div>
    </section>

    <!-- Progress Section -->
    <section id="progress-section" hidden>
      <h2>변환 중...</h2>
      <div class="progress-bar-wrap">
        <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
      </div>
      <p id="progress-message" class="progress-message">준비 중...</p>
      <div id="resize-notice" class="resize-notice" hidden></div>
    </section>

    <!-- Result Section -->
    <section id="result-section" hidden>
      <h2>변환 완료!</h2>
      <div id="result-meta" class="result-meta"></div>
      <div class="gif-preview-wrap">
        <img id="gif-preview" src="" alt="변환된 GIF 미리보기" />
      </div>
      <div class="result-actions">
        <a id="download-btn" href="#" class="btn btn-primary" download>GIF 다운로드</a>
        <button id="reset-btn" class="btn btn-secondary">다른 영상 변환</button>
      </div>
    </section>

    <!-- Error Section -->
    <section id="error-section" hidden>
      <div class="error-box">
        <div class="error-icon">❌</div>
        <p id="error-message"></p>
        <button id="error-reset-btn" class="btn btn-secondary">다시 시도</button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
